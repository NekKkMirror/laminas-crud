services:
  task-service:
    image: ${APP_IMAGE_NAME}
    container_name: ${APP_CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app:cache
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_NODE_ENV: ${APP_NODE_ENV}
      APP_PORT: ${APP_PORT}

      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      XDEBUG_MODE: ${XDEBUG_MODE}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "composer migrations:migrate && php -S 0.0.0.0:${APP_PORT} -t public"

  postgres:
    image: ${DB_IMAGE_NAME}
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -h localhost -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - task-service_pg-data_development:/var/lib/postgresql/data
      - ./local/init/local-init.sql.gz:/docker-entrypoint-initdb.d/local-init.sql.gz

volumes:
  task-service_pg-data_development:
    name: task-service_pg-data_development